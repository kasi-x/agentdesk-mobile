<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentDesk — Card Playground (I-904)</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="playground.css" />
</head>
<body class="pg-body">
  <header class="pg-topbar">
    <div class="brand">
      <a href="index.html" class="brand-link">
        <span class="brand-glyph" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="3" rx="2" />
            <path d="m9 12 2 2 4-4" />
          </svg>
        </span>
        <span class="brand-name">AgentDesk Playground</span>
      </a>
    </div>

    <div class="pg-actions">
      <label class="pg-select-label">
        <span>テンプレート:</span>
        <select id="template-select" class="pg-select">
          <option value="refund-approval">返金承認 (Refund)</option>
          <option value="calendar-change">日程変更 (Calendar)</option>
          <option value="pr-merge">PRマージ (PR Merge)</option>
          <option value="send-email">メール送信 (Send Email)</option>
        </select>
      </label>

      <button id="send-hub-btn" class="btn primary sm" type="button">ハブに送信 (POST /tasks)</button>
      <button id="copy-json-btn" class="btn ghost sm" type="button">JSONコピー</button>
      <a href="index.html" class="btn ghost sm">Triageへ戻る</a>
    </div>
  </header>

  <main class="pg-main">
    <section class="pg-editor-pane">
      <div class="pane-head">
        <span class="pane-title">カード JSON (スキーマ検証付き)</span>
        <span id="lint-badge" class="lint-badge ok">✓ 有効なTaskCard</span>
      </div>
      <div id="lint-msg" class="lint-msg" hidden></div>
      <textarea id="json-editor" class="pg-textarea" spellcheck="false" autocomplete="off"></textarea>
    </section>

    <section class="pg-preview-pane">
      <div class="pane-head">
        <span class="pane-title">実機プレビュー (390px Viewport)</span>
        <span class="pane-hint">タップで詳細展開・クリック操作可能</span>
      </div>
      <div class="pg-device-viewport">
        <div id="pg-card-stage" class="pg-card-stage"></div>
      </div>
    </section>
  </main>

  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
  <script type="module" src="playground.js"></script>
</body>
</html>
